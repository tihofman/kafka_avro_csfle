# Fuer die Live-Demo: nur Warnungen/Fehler, damit die Konsolenausgabe
# der Anwendung nicht im Kafka-Client-Logging untergeht.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.showDateTime=false
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=false

# Diese eine Zeile bleibt bewusst sichtbar - sie beweist waehrend der Demo,
# dass der Schluessel wirklich aus Vault kommt:
#   "Registered kek vertrag-demo-kek"
org.slf4j.simpleLogger.log.io.confluent.kafka.schemaregistry.encryption.EncryptionExecutor=info
